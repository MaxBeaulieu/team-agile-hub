# Self-hosted production stack — SELFHOST_MIGRATION_PLAN.md Phase 6.
#
# Single host, four containers: postgres, backend (ASP.NET Core / .NET 10
# API + SignalR hub), frontend (Next.js, standalone build), proxy (Caddy —
# TLS termination + routing). This box carries every production-availability
# concern that Vercel/Fly.io/Supabase Cloud used to handle (see the plan's
# "Target architecture" section) — there is no managed platform behind it.
#
# Config: copy .env.example to .env at the repo root and fill in real values
# before running `docker compose up -d`.
#
# Do not scale `backend` past 1 replica. Three independent reasons (all fail
# silently, not loudly): SignalR presence is an in-memory registry that would
# fragment across replicas; realtime invalidations only reach the replica
# that handled the write (no Redis backplane); and EF Core's
# `Database.Migrate()` runs at backend startup and is not concurrency-safe.
# See docs/architecture/selfhost-migration.md §3.6/§2.3.
#
# NOTE: the application code these containers run (EF Core data layer, Entra
# auth, SignalR hub, /api/health) has not been written yet — see
# docs/architecture/selfhost-migration.md (incl. Appendix A, the Phase 6
# infra-contract quick reference) and SELFHOST_MIGRATION_PLAN.md Phases 1-5.
# This file is infra scaffolding for that work. Validated as syntactically
# correct YAML (`js-yaml`); NOT validated with `docker compose config` /
# `docker build` — Docker wasn't available in the environment this was
# authored in. Run both before relying on this.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Consumed by postgres/init/01-create-app-role.sh, not by the postgres
      # image's own bootstrap.
      APP_DB_USER: ${POSTGRES_APP_USER}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # Deliberately no `ports:` mapping here — not even bound to 127.0.0.1.
    # docs/architecture/selfhost-migration.md §4.1: once the frontend has no
    # DB credential of its own, keeping Postgres unreachable from outside
    # this compose network is the control that replaces every RLS policy the
    # app used to rely on. Do not add a ports mapping, even temporarily for
    # debugging — `docker compose exec postgres psql ...` reaches it fine
    # without one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      # `service_healthy`, not just "started" — the backend runs EF Core
      # migrations at startup and needs Postgres genuinely ready to accept
      # connections, not merely the container having started.
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # HTTP only inside the container — TLS terminates at Caddy, Kestrel
      # never serves HTTPS here. Set explicitly rather than relying on the
      # base image's default.
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_APP_USER};Password=${POSTGRES_APP_PASSWORD}"
      Jwt__SigningSecret: ${JWT_SIGNING_SECRET}
      Jwt__Issuer: team-agile-hub
      Jwt__Audience: team-agile-hub
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__StaffRefreshDays: ${JWT_STAFF_REFRESH_DAYS:-7}
      Jwt__GuestRefreshDays: ${JWT_GUEST_REFRESH_DAYS:-30}
      Entra__TenantId: ${ENTRA_TENANT_ID}
      Entra__ClientId: ${ENTRA_CLIENT_ID}
      Entra__ClientSecret: ${ENTRA_CLIENT_SECRET}
      # Lets the backend build absolute redirect URIs (e.g. the Entra
      # callback) without depending solely on Caddy's X-Forwarded-* headers.
      App__PublicOrigin: ${APP_PUBLIC_ORIGIN}
      Jira__ClientId: ${JIRA_CLIENT_ID}
      Jira__ClientSecret: ${JIRA_CLIENT_SECRET}
      Jira__RedirectUri: ${JIRA_REDIRECT_URI}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      Encryption__Key: ${ENCRYPTION_KEY}
    # No `ports:` mapping — only the proxy service is reachable from outside
    # the compose network; Caddy talks to `backend:8080` on the internal
    # network.
    healthcheck:
      # docs/architecture/selfhost-migration.md §1.9 specs GET /api/health
      # (liveness, no DB) and GET /api/health/ready (readiness, `SELECT 1`)
      # — neither exists in code yet (implementation on hold). This is a
      # bare TCP-accept check standing in for /api/health in the meantime.
      # Deliberately NOT pointed at /api/health today: doing so would leave
      # the backend permanently "unhealthy" until that endpoint lands, and
      # `frontend`/`proxy`'s `condition: service_healthy` dependency would
      # then refuse to start the whole stack. Once it exists, swap the test
      # below for:
      #   wget -qO- http://127.0.0.1:8080/api/health || exit 1
      # pointed at /api/health specifically, NOT /api/health/ready — the
      # readiness endpoint does a DB round-trip, so using it here would mark
      # an otherwise-healthy backend unhealthy on a transient DB blip. See
      # backend/Dockerfile for the curl/wget-absence and chiseled-base-image
      # caveats that apply if/when this becomes an HTTP-based check.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # PORT / HOSTNAME are also set as defaults in frontend/Dockerfile;
      # repeated here for visibility. HOSTNAME=0.0.0.0 matters — Next.js
      # standalone binds loopback-only by default, which would make Caddy
      # see connection-refused.
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # No `ports:` mapping — reached only via the proxy service.
    healthcheck:
      # node is guaranteed present in the runtime image; wget/curl are not
      # guaranteed across base image variants, so probe with node directly.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
